# 自動在 Windows 上打包 desk-pet 的 .exe 安裝檔
# - 每次 push / PR：建置並把安裝檔上傳成 Artifact（在 Actions 頁面下載）
# - 推送 v 開頭的 tag（例如 v0.1.0）：另外建立 GitHub Release 並附上安裝檔
name: 建置 Windows 安裝檔

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 編譯快取
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安裝前端套件
        run: npm ci

      - name: 建置（產生 .exe 與 .msi）
        run: npx tauri build

      - name: 上傳安裝檔
        uses: actions/upload-artifact@v4
        with:
          name: desk-pet-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/desk-pet.exe

      - name: 建立 Release（只有 tag 會執行）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
