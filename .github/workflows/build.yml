# 自動在 Windows 上打包 desk-pet 的 .exe 安裝檔
# - 每次 push / PR：建置並把安裝檔上傳成 Artifact（在 Actions 頁面下載）
# - 推送 v 開頭的 tag（例如 v0.1.0）：另外建立 GitHub Release 並附上安裝檔
name: 建置 Windows 安裝檔

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 預設只給讀取權限；只有打包工作需要寫入（建立 Release）
permissions:
  contents: read

jobs:
  # 先確認沒有私人角色、金鑰被 commit 進來；沒通過就不打包
  privacy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 隱私檢查
        run: node scripts/check-privacy.mjs

  build-windows:
    needs: privacy-check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 編譯快取
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安裝前端套件
        run: npm ci

      - name: 建置（產生安裝檔 setup.exe）
        run: npx tauri build

      - name: 檢查安裝檔裡的內建角色與台詞
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          7z l $setup.FullName | Select-String -Pattern "skins|lines"

      - name: 上傳安裝檔
        uses: actions/upload-artifact@v4
        with:
          name: desk-pet-windows
          # 只放安裝檔，下載下來只有一個檔案，不容易搞混
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: 建立 Release（只有 tag 會執行）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
